name: build-personal-repo

on:
  schedule:
    - cron: '10 6 * * 0'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pkg: [waywallen, waywallen-display, plasma-wallpaper-waywallen, open-wallpaper-engine]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Init keyring and update base system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo gnupg

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Import GPG signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | sudo -u builder gpg --batch --import

      - name: Bootstrap aurutils
        run: |
          sudo -u builder bash -lc '
            cd /tmp && git clone https://aur.archlinux.org/aurutils.git &&
            cd aurutils && makepkg -si --noconfirm
          '

      - name: Register local repo
        run: |
          mkdir -p /tmp/repo && chown builder:builder /tmp/repo
          printf "\n[personalrepo]\nSigLevel = Optional TrustAll\nServer = file:///tmp/repo\n" >> /etc/pacman.conf
          pacman -Sy --noconfirm

      - name: Build ${{ matrix.pkg }}
        run: |
          sudo -u builder bash -lc '
            aur sync --noview -S -d personalrepo --root /tmp/repo --noconfirm "${{ matrix.pkg }}"
          '

      - name: Upload this package's files (including .sig)
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}
          path: /tmp/repo/*.pkg.tar.zst*
          if-no-files-found: warn

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
      actions: read
    steps:
      - name: Init keyring and install tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed pacman-contrib gnupg github-cli

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: repo
          merge-multiple: true

      - name: Import signing key and rebuild the repo database
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          cd repo
          repo-add -s personalrepo.db.tar.gz *.pkg.tar.zst

      - name: Publish to a stable Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view repo >/dev/null 2>&1 \
            && gh release upload repo repo/* --clobber \
            || gh release create repo repo/* --title "Personal repo (auto-updated)" --notes "Auto-built $(date -u +%F)"
