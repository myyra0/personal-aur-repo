name: build-personal-repo

on:
  schedule:
    - cron: '10 6 * * *'   # everyday 6:10
  workflow_dispatch: {} 

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Init keyring and update base system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo gnupg

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Import GPG signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | sudo -u builder gpg --batch --import

      - name: Bootstrap aurutils
        run: |
          sudo -u builder bash -lc '
            cd /tmp && git clone https://aur.archlinux.org/aurutils.git &&
            cd aurutils && makepkg -si --noconfirm
          '

      - name: Register local repo
        run: |
          mkdir -p /tmp/repo && chown builder:builder /tmp/repo
          sudo -u builder repo-add /tmp/repo/personalrepo.db.tar.gz
          printf "\n[personalrepo]\nSigLevel = Optional TrustAll\nServer = file:///tmp/repo\n" >> /etc/pacman.conf
          pacman -Sy --noconfirm

      - name: Build packages (each independent, so one failure doesn't block the rest)
        run: |
          sudo -u builder bash -lc '
            for pkg in waywallen waywallen-display plasma-wallpaper-waywallen open-wallpaper-engine; do
              echo "::group::Building $pkg"
              aur sync -S -d personalrepo --root /tmp/repo --noconfirm "$pkg" || echo "::warning::$pkg failed to build"
              echo "::endgroup::"
            done
          '

      - name: Upload repo as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: personalrepo
          path: /tmp/repo/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personalrepo
          path: repo
      - name: Publish to a stable Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view repo >/dev/null 2>&1 \
            && gh release upload repo repo/* --clobber \
            || gh release create repo repo/* --title "Personal repo (auto-updated)" --notes "Auto-built $(date -u +%F)"
